<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <title>ソサイチ フォーメーション</title>

    <link rel="stylesheet" href="/css/style.css">
</head>


<body>

    <!-- ============================== -->
    <!-- タイトル -->
    <!-- ============================== -->

    <h1>⚽ ソサイチ フォーメーション</h1>


    <!-- ============================== -->
    <!-- フォーメーション選択 -->
    <!-- ============================== -->

    <div class="formation-select">

        <label for="formationSelect">
            フォーメーション
        </label>

        <select id="formationSelect">

            <option value="2-3-1">
                2-3-1
            </option>

            <option value="3-2-1">
                3-2-1
            </option>

            <option value="3-3-0">
                3-3-0
            </option>

            <option value="free">
                その他（自由配置）
            </option>

        </select>

    </div>


    <!-- ============================== -->
    <!-- チーム名 -->
    <!-- ============================== -->

    <div class="team-name">
        Chocolate Disco
    </div>


    <!-- ============================== -->
    <!-- フォーメーションフィールド -->
    <!-- ============================== -->

    <div
        class="formation"
        id="formation"
    >

        <!--
            フォーメーションの中身は
            JavaScriptで自動的に作成する
        -->

    </div>


    <!-- ============================== -->
    <!-- 選手登録 -->
    <!-- ============================== -->

    <div class="player-registration">

        <h2>選手登録</h2>


        <div>

            <input
                type="text"
                id="playerName"
                placeholder="選手名を入力"
            >

            <button id="addPlayerButton">
                登録
            </button>

        </div>


        <!-- 登録した選手一覧 -->

        <ul id="playerList"></ul>

    </div>


    <!-- ============================== -->
    <!-- JavaScript -->
    <!-- ============================== -->

    <script src="/js/formation.js"></script>

</body>

</html>
